<script>
/* A Day in Light — one point of light paints a woman's day in 3D space.
   Controls (no on-screen UI by design): click/space = pause, ←/→ = seek, R = restart, F = fullscreen.
   URL: ?t=<seconds> start time, ?still=1 render one frame and stop,
   ?w=&h= force the render resolution (used for offline video export via __light.step). */
(() => {
'use strict';

const lerp = (a, b, t) => a + (b - a) * t;
let seed = 7;

/* ---------- curve helpers (work on arrays of N-dim points) ---------- */
function cr(pts, seg = 7) {

    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    for (let j = 0; j < seg; j++) {
      const t = j / seg, t2 = t * t, t3 = t2 * t, q = [];
      for (let d = 0; d < D; d++)
        q.push(.5 * ((2 * p1[d]) + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3));

}
function resample(pts, step) {
  const out = [pts[0]]; let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];

    if (L < 1e-6) continue;

  if (Math.hypot(l[0] - o[0], l[1] - o[1], l[2] - o[2]) > step * .3 || out.length < 2) out.push(l);
  return out;
}

/* ---------- stroke store ---------- */
const strokes = [];
const FIG = [255, 236, 218];
const NSC = 10;
const HW = [2.6, 2, 2.2, 2.2, 2.4, 5.2, 2.4, 6.6, 2.2, 2.6];
const DUR = [19, 15, 15, 16, 16, 21, 15, 23, 15, 22];
const COL = [[255, 186, 112], [110, 205, 255], [255, 166, 84], [255, 128, 172], [186, 148, 255],
             [112, 250, 214], [255, 108, 200], [104, 146, 255], [168, 146, 255], [92, 124, 235]];
const CAMS = [ // local target x,y,z, distance, yaw offset (deg), follow
  [.2, .95, 0, 6.3, 12, .25], [0, 1.15, 0, 5.6, -14, .2], [0, 1.05, 0, 5.2, 16, .2], [.3, 1.05, 0, 4.9, -36, .15],
  [-.1, 1.05, 0, 6, 10, .25], [0, 1.35, 0, 8.8, -8, .8], [.2, 1.05, 0, 5.8, 18, .25], [0, 2.3, 0, 11.5, 8, .75],
  [.3, 1.1, 0, 5.2, -30, .15], [0, .95, 0, 6.4, -10, .2]];
const SCN = [];
{ let x = 0; for (let i = 0; i < NSC; i++) { if (i) x += HW[i - 1] + HW[i] + 2.5; SCN.push({ i, ox: x, oz: 2.2 * Math.sin(i * 1.3), yaw: .22 * Math.sin(i * 2.1 + .5), col: COL[i] }); } }
let SC = SCN[0];
const toWorld = (sc, p) => { const c = Math.cos(sc.yaw), s = Math.sin(sc.yaw); return [sc.ox + p[0] * c + p[2] * s, p[1], sc.oz - p[0] * s + p[2] * c]; };

function S(pts, o = {}) {
  let p = o.s ? cr(pts) : pts;
  p = resample(p.map(q => toWorld(SC, q)), o.step || .035);
  const n = p.length, f = new Float32Array(n * 3);
  let len = 0;
  for (let i = 0; i < n; i++) { f[i * 3] = p[i][0]; f[i * 3 + 1] = p[i][1]; f[i * 3 + 2] = p[i][2]; if (i) len += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1], p[i][2] - p[i - 1][2]); }
  const col = o.col || SC.col;
  strokes.push({ p: f, n, len, col: `rgb(${col[0]},${col[1]},${col[2]})`, rgb: col,
    core: `rgb(${col.map(v => Math.round(lerp(v, 255, .6))).join(',')})`,
    a: o.a ?? 1, w: o.w || .9, grp: o.grp || 'props', fx: o.fx, ph: rnd(), sc: SC.i, life: o.life, fade: o.fade, speed: o.speed || 1, dur: o.dur });
}
const L = (pts, o) => S(pts, o);
const C = (pts, o) => S(pts, Object.assign({ s: 1 }, o));
const EXZ = (cx, y, cz, rx, rz, o, n = 28) => { const p = []; for (let i = 0; i <= n; i++) { const t = i / n * TAU; p.push([cx + rx * Math.cos(t), y, cz + rz * Math.sin(t)]); } S(p, o); };
const EXY = (cx, cy, z, rx, ry, o, a0 = 0, a1 = 360, n = 28) => { const p = []; for (let i = 0; i <= n; i++) { const t = lerp(a0, a1, i / n) * RAD; p.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t), z]); } S(p, o); };
const RXY = (x0, y0, x1, y1, z, o) => S([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z], [x0, y0, z]], o);
const star = (x, y, z, s, o) => S([[x - s, y, z], [x + s, y, z], [x, y, z], [x, y + s, z], [x, y - s, z]], Object.assign({ fx: 'tw' }, o));
function crescent(cx, cy, z, r, o) {
  const p = []; for (let a = 60; a <= 300; a += 15) p.push([cx + r * Math.cos(a * RAD), cy + r * Math.sin(a * RAD), z]);
  p.push([cx - .12 * r, cy - .5 * r, z], [cx - .3 * r, cy, z], [cx - .12 * r, cy + .5 * r, z], p[0]);

}
function helix(cx, cz, o) {

}

/* ---------- the woman: a parametric 2D figure (x = forward, y = up) ---------- */
const LW = [[0, .078], [.12, .076], [.26, .064], [.44, .047], [.56, .05], [.7, .038], [.86, .024]];

    pt(d, off) { return d <= l1 ? [o[0] + d * d1[0] + off * q1[0], o[1] + d * d1[1] + off * q1[1]] : [k[0] + (d - l1) * d2[0] + off * q2[0], k[1] + (d - l1) * d2[1] + off * q2[1]]; } };
}
function figure(Q) {
  const P = Object.assign({ y: .9, g: 1, rot: 0, sp: 0, sp2: 0, nk: 0, aA: [8, 10], aB: [-10, 10], lA: [4, -3, 0], lB: [-4, -3, 0], outfit: 'slip', hat: 0, heels: 0, hair: 'long' }, Q);

      legs[s].ft = l[2] || 0;

      f.push([e[0] + d2[0] * .05 + q[0] * .026, e[1] + d2[1] * .05 + q[1] * .026], [e[0] + d2[0] * .105, e[1] + d2[1] * .105], [e[0] + d2[0] * .05 - q[0] * .022, e[1] + d2[1] * .05 - q[1] * .022]);

    };
    const legStroke = (s, d0) => {
      const a = legs[s], f = [], b = [];
      for (const [d] of LW) if (d >= d0 - .001) { const w = wAt(LW, d); f.push(a.pt(d, w)); b.push(a.pt(d, -w)); }
      if (d0 > 0 && d0 < .84 && !LW.some(v => Math.abs(v[0] - d0) < .02)) { const w = wAt(LW, d0); f.unshift(a.pt(d0, w)); b.unshift(a.pt(d0, -w)); }

      const heel = [e[0] + d2[0] * .05 - t[0] * .045, e[1] + d2[1] * .05 - t[1] * .045];
      const toe = [e[0] + d2[0] * .05 + t[0] * .17, e[1] + d2[1] * .05 + t[1] * .17];
      f.push([e[0] + t[0] * .08 + d2[0] * .012, e[1] + t[1] * .08 + d2[1] * .012], toe, [toe[0] - t[0] * .03 + d2[0] * .018, toe[1] - t[1] * .03 + d2[1] * .018]);
      if (P.heels) f.push([heel[0] + t[0] * .05 + d2[0] * .02, heel[1] + t[1] * .05 + d2[1] * .02], [heel[0], heel[1] - .085], heel); else f.push([heel[0] + d2[0] * .02, heel[1] + d2[1] * .02]);

    };

    const skirt = (Ln, fl, flB) => {
      const fr = [sp(.19, .078), sp(.1, .118)], bk = [sp(.19, -.078), sp(.1, -.124)];
      const ds = []; for (let d = .1; d < Ln - .03; d += .09) ds.push(d); ds.push(Ln);
      for (const d of ds) {
        const w = wAt(LW, Math.min(d, .86)), f = d / Ln, oF = w + fl * Math.pow(f, 1.3), oB = w + flB * Math.pow(f, 1.8);
        const A = legs.A, B = legs.B, th = d <= .44, q = dn(((th ? A.a1 + B.a1 : A.a2 + B.a2) / 2) + 90);

        bk.push(ba[0] * q[0] + ba[1] * q[1] < bb[0] * q[0] + bb[1] * q[1] ? ba : bb);
      }
      const F = fr[fr.length - 1], B = bk[bk.length - 1], hem = [], hx = B[0] - F[0], hy = B[1] - F[1], hl = Math.hypot(hx, hy) || 1;
      for (let i = 1; i < 8; i++) { const t = i / 8, o = Math.sin(t * Math.PI * 4) * .014 + Math.sin(t * Math.PI) * .02; hem.push([F[0] + hx * t + hy / hl * o, F[1] + hy * t - hx / hl * o]); }
      St.push({ p: fr.concat(hem, bk.reverse()), z: 0 });
    };
    // --- head
    { const h = []; for (let i = 0; i <= 30; i++) { const t = -Math.PI / 2 + i / 30 * TAU, s = Math.sin(t); let a = .08 * Math.cos(t), b = .105 * s; if (s < 0) { a *= 1 - .22 * Math.pow(-s, 1.5); a += .012 * -s; } a += .016 * Math.exp(-Math.pow((((t + Math.PI) % TAU) - Math.PI + .12) / .22, 2)); h.push(hp(a, b)); } St.push({ p: h, z: 0 }); }

    } else {
      St.push({ p: [hp(.062, .085), hp(.01, .124), hp(-.07, .095), hp(-.105, .01), hp(-.11, -.09), sp(.44, -.165), sp(.34, -.16), sp(.27, -.2)], z: -.02 });
      St.push({ p: [hp(-.02, .118), hp(-.075, .03), hp(-.08, -.1), sp(.44, -.118), sp(.35, -.125), sp(.3, -.15)], z: -.03, w: .9 });

function addFig(P) {

const loc = (P, X, Y) => [(X - (P.px || 0)) * (P.face || 1), Y];   // scene coords -> figure-local IK target

/* ---------- props ---------- */
function bed(o) {
